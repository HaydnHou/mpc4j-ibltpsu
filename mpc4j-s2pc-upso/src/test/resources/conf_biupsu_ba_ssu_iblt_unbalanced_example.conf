# BA-SSU-IBLT bi-output benchmark example for m = 2^10, n = 2^18.
# overlap = 256 fixes the overlap rate at 1/4 of the small side for reproducible local runs.
# This is a reference/costed benchmark config, not a production-secure protocol config.
mLog = 10
nLog = 18
overlap = 256
elementBytes = 8
degree = 3
alpha = 1.55
retry = 1
seed = 20260603
checkBits = 182
tagBits = 182
cot = 2
batch = 16384
maskedPayload = false
evaluatorMode = CASE_GATE_WIRE_MASKED
delivery = SIGNED_SOURCE_SPLIT
repeat = 1
warmup = 0
tsv = false
