# server information
server_name = server
server_ip = 127.0.0.1
server_port = 9002

# client information
client_name = client
client_ip = 127.0.0.1
client_port = 9003

# append string in the output file
append_string = pis_iblt

# protocol type
pto_type = UPSU

# protocol config
element_byte_length = 16
server_log_set_size = 5,10
client_log_set_size = 5,18

# UpsuType name
upsu_pto_name = PIS_IBLT

# PISF-IBLT final-candidate strict profile
pis_iblt_mode = STRICT
pis_iblt_max_element_byte_length = 16
pis_iblt_d_max = 5
pis_iblt_repetition_num = 3
pis_iblt_security_parameter = 128
pis_iblt_tag_byte_length = 16
