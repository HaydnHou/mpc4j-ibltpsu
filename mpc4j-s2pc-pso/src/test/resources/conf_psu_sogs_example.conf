# server information
server_name = server
server_ip = 127.0.0.1
server_port = 9002

# client information
client_name = client
client_ip = 127.0.0.1
client_port = 9003

# append string in the output file
append_string = sogs_example

# protocol type
pto_type = PSU

# protocol config
element_byte_length = 8
server_log_set_size = 18,5
client_log_set_size = 10,5
parallel = true

# PSU name, see PsuType
psu_pto_name = SOGS

# common PSU configs
silent_cot = true
compress_encode = true
rosn_type = GMR21_NET

# SOGS-PSU configs
sogs_alpha = 1.25
sogs_degree = 3
