# server information
server_name = server
server_ip = 127.0.0.1
server_port = 9002

# client information
client_name = client
client_ip = 127.0.0.1
client_port = 9003

# append string in the output file
append_string = example

# protocol type
pto_type = PSU

# protocol config
element_byte_length = 8
server_log_set_size = 12,10
client_log_set_size = 12,10
parallel = true

# PSU name, see PsuType
psu_pto_name =

# PSU configs
silent_cot = true
compress_encode = true
rosn_type = GMR21_NET

# IBLT/SOGS sketch configs.
# For psu_pto_name = IBLT, the protocol uses H5-IBLT and reads iblt_multiplier.
# For psu_pto_name = SOGS, the protocol reads sogs_profile.
#   BALANCED uses SOGS_GRAPH as the current IBLT-style baseline.
#   UNBALANCED_REUSABLE is reserved for static large-set repeated sessions.
# SOGS also reads sogs_alpha / sogs_degree.
sogs_profile = BALANCED
iblt_multiplier = 3.5
sogs_alpha = 1.25
sogs_degree = 3
